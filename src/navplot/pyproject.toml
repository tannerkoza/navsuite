[project]
name = "navplot"
version = "0.1.0"
description = "A Python plotting package within the navsuite collection of navigation-related tools."
readme = "README.md"
authors = [{ name = "Tanner Koza", email = "kozatanner@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "plotly>=6.2.0",
    "seaborn>=0.13.2",
    "pyvista @ git+https://github.com/pyvista/pyvista.git",
    "navsim @ git+https://github.com/tannerkoza/navsuite.git#subdirectory=src/navsim",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navplot"]

[tool.hatch.metadata]
allow-direct-references = true
