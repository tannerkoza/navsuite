[project]
name = "navplot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Tanner Koza", email = "kozatanner@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "plotly>=6.2.0",
    "seaborn>=0.13.2",
    "pyvista @ git+https://github.com/pyvista/pyvista.git",
]

[project.scripts]
navplot = "navplot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
