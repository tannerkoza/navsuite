[project]
name = "navtools"
version = "0.1.0"
description = "A Python package of common navigation utilities within the navsuite collection of navigation-related tools."
readme = "README.md"
authors = [{ name = "Tanner Koza", email = "kozatanner@gmail.com" }]
requires-python = ">= 3.10"
dependencies = [
    "numpy>=2.2.6",
    "aspn23 @ git+https://github.com/tannerkoza/aspn-python.git#subdirectory=aspn-py",
    "aspn23-lcm @ git+https://github.com/tannerkoza/aspn-python.git#subdirectory=aspn-lcm-py",
    "prompt-toolkit>=3.0.51",
    "aiohttp>=3.12.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navtools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
aspn23-lcm = { git = "https://github.com/tannerkoza/aspn-python.git", subdirectory = "aspn-lcm-py" }
