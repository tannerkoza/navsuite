[project]
name = "navsim"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Tanner Koza", email = "kozatanner@gmail.com" }
]
dependencies = [
    "sgp4>=2.24",
    "prompt-toolkit>=3.0.51",
    "tqdm>=4.67.1",
    "astropy>=6.1.7",
    "scipy>=1.15.3",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/navsim"]
