[project]
name = "navgnss"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Tanner Koza", email = "kozatanner@gmail.com" }
]
dependencies = ["navtools @ git+https://github.com/tannerkoza/navsuite.git#subdirectory=src/navtools"]
